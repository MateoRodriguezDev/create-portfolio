<section class="m-6 md:w-180 lg:w-229">
  @if (profileResource.isLoading()) {
    <p>Cargando perfil...</p>
  } @else if (profileResource.error()) {
    <p>Error al cargar el perfil</p>
  } @else if (profileResource.value(); as profile) {
    <div class="fixed top-4 right-4">
      @if (_authService.isLoggedIn() !== undefined) {
        <button class="btn" type="button" (click)="router.navigate(['/profile'])">
          {{
            _authService.isLoggedIn()
              ? 'My Profile'
              : 'Create a Profile!'
          }}
        </button>
      }
    </div>

    <div class="mb-15">
      <app-user-info-bar (profileUpdated)="profileResource.reload()" [profile]="profile" />
    </div>

    <div class="flex flex-col md:flex-row gap-2">
      <app-user-links-techs class="w-full md:w-1/3 order-1 md:order-2"> </app-user-links-techs>
      <app-user-projects class="w-full md:w-2/3 order-2 md:order-1"> </app-user-projects>
    </div>
  }
</section>
