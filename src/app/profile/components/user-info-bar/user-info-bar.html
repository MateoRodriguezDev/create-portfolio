<section class="flex flex-col md:flex-row items-center gap-4">

  <div class="flex w-full md:w-2/3 gap-4">
    <img
      [src]="imgUrl()"
      [alt]="profile().userName"
      class="w-28 md:w-35 lg:w-42 border-3 border-b-gray-900 shrink-0"
    />

    <div class="flex flex-col gap-2 items-start mt-1">
      <h2 class="text-xl md:text-2xl font-montserrat text-color font-extralight">
        {{ profile().userName }}
        <span (click)="openModal()" class="text-lg md:text-xl hover:cursor-pointer">🖉</span>
      </h2>
      <p class="text-gray-600 text-start text-sm md:text-base">
        Lorem ipsum dolor sit amet conse
      </p>
    </div>
  </div>

  <div class="flex flex-col gap-4 w-full md:w-1/3">
    <div class="flex items-center gap-4 justify-start steam-glass rounded-[3px] p-3 w-full">
      <img class="w-10 md:w-12" [src]="profile().title.titleIconURL" />
      <h2 class="text-color font-montserrat tracking-widest text-sm md:text-base">
        {{ profile().title.titleName }}
      </h2>
    </div>
  </div>

</section>

@if (isModalOpen()) {
  <app-edit-profile-modal (close)="closeModal()" (updated)="profileUpdated.emit()" />
}
