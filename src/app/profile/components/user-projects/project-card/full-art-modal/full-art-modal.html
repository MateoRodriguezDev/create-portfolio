<div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center" (click)="onClose()">
  <div class="w-3/5" (click)="$event.stopPropagation()">
    <div class="flex flex-row justify-between items-center p-2 bg-gray-700">
      <a
        [href]="project().projectURL"
        class="p-2 text-white font-semibold tracking-widest"
        target="_blank"
        >{{ project().projectName }}</a
      >

      <div>
        @if (_profileService.actualUserProfileId() === +profileId()) {
          <button
            class="btn btn-ghost btn-sm opacity-40 hover:opacity-100 transition-opacity"
            type="button"
            (click)="onDelete()"
          >
            <svg class="size-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M10 12L14 16M14 12L10 16M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6M18 6V16.2C18 17.8802 18 18.7202 17.673 19.362C17.3854 19.9265 16.9265 20.3854 16.362 20.673C15.7202 21 14.8802 21 13.2 21H10.8C9.11984 21 8.27976 21 7.63803 20.673C7.07354 20.3854 6.6146 19.9265 6.32698 19.362C6 18.7202 6 17.8802 6 16.2V6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </button>
          <button
            (click)="onEdit()"
            class="text-lg md:text-xl btn btn-ghost btn-sm opacity-40 hover:opacity-100 transition-opacity"
          >
            🖉
          </button>
        }
      </div>
    </div>
    <img [src]="imgUrl()" [alt]="project().projectName" class="w-full max-w-640" />
    <div class="flex items-center gap-2 px-3 py-2 border-t border-white/10 bg-gray-700">
      <span class="text-white text-[13px] mr-1 whitespace-nowrap">Stack:</span>
      <div class="flex flex-wrap gap-2">
        @for (tech of technologies(); track tech.techName) {
          <img [src]="tech.imgURL" [alt]="tech.techName" class="size-7" [title]="tech.techName" />
        }
      </div>
    </div>
  </div>
</div>
