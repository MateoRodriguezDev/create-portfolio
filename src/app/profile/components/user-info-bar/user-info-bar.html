<section class="flex flex-col md:flex-row items-center ">
  <div class="flex w-full md:w-2/3">
    <img
      [src]="imgUrl()"
      [alt]="profile().userName"
      class="w-35 md:w-42 border-3 border-b-gray-900"
    />

    <div class="flex flex-col gap-2 items-start mt-1 ml-8">
      <h2 class="text-2xl font-montserrat text-color font-extralight">{{ profile().userName }}</h2>
      <p class="text-gray-600 text-start">
        Lorem ipsum dolor sit amet conse
      </p>
    </div>
  </div>

  <div class="flex flex-col gap-4 col-span-2 lg:col-span-1 w-1/3">
    <div class="flex items-center gap-4 justify-start steam-glass rounded-[3px] p-3 w-full">
      <img class="w-12" [src]="profile().title.titleIconURL" />
      <h2 class="text-color font-montserrat tracking-widest">{{ profile().title.titleName }}</h2>
    </div>
  </div>
</section>
